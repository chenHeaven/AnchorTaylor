# Default training settings and hyperparameters for M3FD scale-l + deeper fusehd_fourth training

task: detect
mode: train

# Train settings -------------------------------------------------------------------------------------------------------
model:
data:
epochs: 300
patience: 80
batch: 8
imgsz: 640
save: True
save_period: -1
cache: False
device:
workers: 4
project:
name:
exist_ok: False
pretrained: True
optimizer: AdamW
verbose: True
seed: 0
