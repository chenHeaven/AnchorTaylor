# Spatial-domain ablation for frequency-decoupled design.
# This model removes DWT/IWT and high-frequency delayed compensation.
# RGB/IR features are fused directly in the spatial domain with the same
# grouped adaptive fusion + NC-SSD path, then fed to a standard P2/P3/P4 head.

nc: 6
depth_multiple: 0.33
width_multiple: 0.25

backbone:
  # [from, number, module, args]
  [
    # P1/2 dual stream
    [-4, 1, Conv, [64, 3, 2]],                         # 0 RGB P1/2
    [-4, 1, Conv, [64, 3, 2]],                         # 1 IR P1/2
    [[0, 1], 1, spatial_fuse_ncssd, [64, 'p1', False, True, 1]],  # 2 spatial fusion P1/2

    # P2/4 dual stream with fused prior
    [2, 1, Conv, [64, 3, 2]],                          # 3 fused prior P2/4
    [0, 1, Conv, [128, 3, 2]],                         # 4 RGB P2/4
    [[4, 3], 1, Concat, [1]],                          # 5
    [-1, 4, C2f, [128, True]],                         # 6 RGB P2/4
    [1, 1, Conv, [128, 3, 2]],                         # 7 IR P2/4
    [[7, 3], 1, Concat, [1]],                          # 8
    [-1, 4, C2f, [128, True]],                         # 9 IR P2/4
    [[6, 9], 1, spatial_fuse_ncssd, [128, 'p2', False, True, 3]], # 10 spatial fusion P2/4

    # P3/8 dual stream with fused prior
    [6, 1, Conv, [256, 3, 2]],                         # 11 RGB P3/8
    [-1, 10, C2f, [256, True]],                        # 12
    [10, 1, Conv, [256, 3, 2]],                        # 13 fused prior P3/8
    [[12, 13], 1, Concat, [1]],                        # 14
    [-1, 1, Conv, [256, 1, 1]],                        # 15 RGB P3/8
    [9, 1, Conv, [256, 3, 2]],                         # 16 IR P3/8
    [-1, 10, C2f, [256, True]],                        # 17
    [10, 1, Conv, [256, 3, 2]],                        # 18 fused prior P3/8
    [[17, 18], 1, Concat, [1]],                        # 19
    [-1, 1, Conv, [256, 1, 1]],                        # 20 IR P3/8
    [[15, 20], 1, spatial_fuse_ncssd, [256, 'p3', False, True, 3]], # 21 spatial fusion P3/8

    # P4/16 dual stream with fused prior
    [15, 1, Conv, [512, 3, 2]],                        # 22 RGB P4/16
    [-1, 10, C2f, [512, True]],                        # 23
    [21, 1, Conv, [512, 3, 2]],                        # 24 fused prior P4/16
    [[23, 24], 1, Concat, [1]],                        # 25
    [-1, 1, Conv, [512, 1, 1]],                        # 26
    [-1, 1, SPPF, [512, 5]],                           # 27 RGB P4/16
    [20, 1, Conv, [512, 3, 2]],                        # 28 IR P4/16
    [-1, 10, C2f, [512, True]],                        # 29
    [21, 1, Conv, [512, 3, 2]],                        # 30 fused prior P4/16
    [[29, 30], 1, Concat, [1]],                        # 31
    [-1, 1, Conv, [512, 1, 1]],                        # 32
    [-1, 1, SPPF, [512, 5]],                           # 33 IR P4/16
    [[27, 33], 1, spatial_fuse_ncssd, [512, 'p4', False, True, 1]], # 34 spatial fusion P4/16
  ]

head:
  [
    # Top-down FPN
    [34, 1, Conv, [512, 1, 1]],                        # 35 P4
    [-1, 1, nn.Upsample, [None, 2, 'nearest']],        # 36 up to P3/8
    [[-1, 21], 1, Concat, [1]],                        # 37
    [-1, 3, C2f, [256]],                               # 38 P3 head

    [-1, 1, Conv, [256, 1, 1]],                        # 39
    [-1, 1, nn.Upsample, [None, 2, 'nearest']],        # 40 up to P2/4
    [[-1, 10], 1, Concat, [1]],                        # 41
    [-1, 3, C2f, [128]],                               # 42 P2 head

    # Bottom-up PAN
    [-1, 1, Conv, [256, 3, 2]],                        # 43 down to P3/8
    [[-1, 38], 1, Concat, [1]],                        # 44
    [-1, 3, C2f, [256]],                               # 45 P3 refined

    [-1, 1, Conv, [512, 3, 2]],                        # 46 down to P4/16
    [[-1, 35], 1, Concat, [1]],                        # 47
    [-1, 3, C2f, [512]],                               # 48 P4 refined

    [[42, 45, 48], 1, Detect, [nc]],                   # 49 Detect(P2, P3, P4)
  ]
