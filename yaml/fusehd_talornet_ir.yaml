# Five-stage spatial RGB-IR detector with IR-primary Taylor fusion.
# TalorNet args: [output_channels, scale, Taylor_order, use_ir_vmamba]
# AuxDetect args: [nc, auxiliary_loss_weight]
nc: 1
depth_multiple: 0.67
width_multiple: 0.75

backbone:
  # [from, repeats, module, args]
  [
    # P1 /2
    [-4, 1, Conv, [64, 3, 2]],                         # 0 RGB
    [-4, 1, Conv, [64, 3, 2]],                         # 1 IR
    [[0, 1], 1, TalorNet, [64, p1, 1, False]],         # 2 [Taylor fused, IR zero]
    [2, 1, getreturntalorfuse, [64]],                  # 3 fused P1
    [2, 1, getreturntalorir, [64]],                    # 4 IR-zero P1
    [3, 1, Conv, [64, 3, 2]],                          # 5 fused prior /4

    # P2 /4
    [0, 1, Conv, [128, 3, 2]],                         # 6
    [[-1, 5], 1, Concat, [1]],                         # 7
    [-1, 4, C2f, [128, True]],                         # 8 RGB P2
    [1, 1, Conv, [128, 3, 2]],                         # 9
    [[-1, 5], 1, Concat, [1]],                         # 10
    [-1, 4, C2f, [128, True]],                         # 11 IR P2
    [[8, 11], 1, TalorNet, [128, p2, 2, False]],       # 12
    [12, 1, getreturntalorfuse, [128]],                # 13 fused P2
    [12, 1, getreturntalorir, [128]],                  # 14 IR-zero P2

    # P3 /8
    [8, 1, Conv, [256, 3, 2]],                         # 15
    [-1, 6, C2f, [256, True]],                         # 16
    [13, 1, Conv, [256, 3, 2]],                        # 17 fused prior
    [[16, 17], 1, Concat, [1]],                        # 18
    [-1, 1, Conv, [256, 1, 1]],                        # 19 RGB P3
    [11, 1, Conv, [256, 3, 2]],                        # 20
    [-1, 6, C2f, [256, True]],                         # 21
    [[21, 17], 1, Concat, [1]],                        # 22
    [-1, 1, Conv, [256, 1, 1]],                        # 23 IR P3
    [[19, 23], 1, TalorNet, [256, p3, 3, True]],       # 24
    [24, 1, getreturntalorfuse, [256]],                # 25 fused P3, main lateral
    [24, 1, getreturntalorir, [256]],                  # 26 IR-zero P3, auxiliary

    # P4 /16
    [19, 1, Conv, [512, 3, 2]],                        # 27
    [-1, 6, C2f, [512, True]],                         # 28
    [25, 1, Conv, [512, 3, 2]],                        # 29 fused prior
    [[28, 29], 1, Concat, [1]],                        # 30
    [-1, 1, Conv, [512, 1, 1]],                        # 31 RGB P4
    [23, 1, Conv, [512, 3, 2]],                        # 32
    [-1, 6, C2f, [512, True]],                         # 33
    [[33, 29], 1, Concat, [1]],                        # 34
    [-1, 1, Conv, [512, 1, 1]],                        # 35 IR P4
    [[31, 35], 1, TalorNet, [512, p4, 3, True]],       # 36
    [36, 1, getreturntalorfuse, [512]],                # 37 fused P4, main lateral
    [36, 1, getreturntalorir, [512]],                  # 38 IR-zero P4, auxiliary

    # P5 /32: restored after removing wavelet downsampling.
    [31, 1, Conv, [1024, 3, 2]],                       # 39
    [-1, 4, C2f, [1024, True]],                        # 40
    [37, 1, Conv, [1024, 3, 2]],                       # 41 fused prior
    [[40, 41], 1, Concat, [1]],                        # 42
    [-1, 1, Conv, [1024, 1, 1]],                       # 43
    [-1, 1, SPPF, [1024, 5]],                          # 44 RGB P5
    [35, 1, Conv, [1024, 3, 2]],                       # 45
    [-1, 4, C2f, [1024, True]],                        # 46
    [[46, 41], 1, Concat, [1]],                        # 47
    [-1, 1, Conv, [1024, 1, 1]],                       # 48
    [-1, 1, SPPF, [1024, 5]],                          # 49 IR P5
    [[44, 49], 1, TalorNet, [1024, p5, 2, True]],      # 50
    [50, 1, getreturntalorfuse, [1024]],               # 51 fused P5, main lateral
    [50, 1, getreturntalorir, [1024]],                 # 52 IR-zero P5, auxiliary
  ]

head:
  [
    # Standard YOLOv8 P5 -> P4 -> P3 top-down path.
    [51, 1, Conv, [512, 1, 1]],                        # 53
    [-1, 1, nn.Upsample, [null, 2, nearest]],          # 54 /16
    [[-1, 37], 1, Concat, [1]],                        # 55
    [-1, 3, C2f, [512]],                               # 56 P4 head
    [-1, 1, Conv, [256, 1, 1]],                        # 57
    [-1, 1, nn.Upsample, [null, 2, nearest]],          # 58 /8
    [[-1, 25], 1, Concat, [1]],                        # 59
    [-1, 3, C2f, [256]],                               # 60 P3 head

    # Standard YOLOv8 P3 -> P4 -> P5 bottom-up path.
    [-1, 1, Conv, [512, 3, 2]],                        # 61 /16
    [[-1, 56], 1, Concat, [1]],                        # 62
    [-1, 3, C2f, [512]],                               # 63 P4 refined
    [-1, 1, Conv, [1024, 3, 2]],                       # 64 /32
    [[-1, 51], 1, Concat, [1]],                        # 65
    [-1, 3, C2f, [1024]],                              # 66 P5 refined

    # Auxiliary IR-zero head is used only during training. Main head is used for inference.
    [[26, 38, 52], 1, AuxDetect, [nc, 0.25]],          # 67 auxiliary loss head
    [[60, 63, 66], 1, Detect, [nc]],                   # 68 main P3/P4/P5 head
  ]
